# Credential-free kubeconfig for the sandbox agent (k8s provider, stage 1).
#
# This file is SAFE to live on the PVC: it contains NO secret. The bearer token
# never enters the sandbox — the OpenShell kubernetes-api provider delivers an
# opaque placeholder (openshell:resolve:env:…) as $KUBE_TOKEN in the process
# environment, the exec plugin below echoes it into the client credential, and
# the supervisor's egress proxy swaps the placeholder for the real token ONLY on
# requests to kubernetes.default.svc.cluster.local:443 (the provider-profile endpoint).
#
# insecure-skip-tls-verify: the enforced endpoint terminates TLS at the sandbox
# boundary (MITM by design, for credential injection), so the presented cert is
# the sandbox CA, not the cluster CA. Stage 2 may replace this with proper CA
# trust once SSL_CERT_FILE delivery to session processes is fixed.
#
# Rotation: `oc whoami -t` tokens expire in ~24h; rotate with
#   KUBE_TOKEN="$(KUBECONFIG=$KUBECONFIG oc whoami -t)" \
#     openshell provider update kubernetes-api --credential KUBE_TOKEN
apiVersion: v1
kind: Config
clusters:
  - name: ocp5-1
    cluster:
      server: https://kubernetes.default.svc.cluster.local:443
      insecure-skip-tls-verify: true
contexts:
  - name: ocp5-1
    context:
      cluster: ocp5-1
      user: openshell-provider
current-context: ocp5-1
preferences: {}
users:
  - name: openshell-provider
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1
        command: sh
        args:
          - -c
          - 'echo "{\"apiVersion\":\"client.authentication.k8s.io/v1\",\"kind\":\"ExecCredential\",\"status\":{\"token\":\"$KUBE_TOKEN\"}}"'
        interactiveMode: Never
