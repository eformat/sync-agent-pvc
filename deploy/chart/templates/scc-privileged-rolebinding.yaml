{{/*
Privileged SCC for the openshell-sandbox service account — the GitOps-clean equivalent of
`oc adm policy add-scc-to-user privileged -z openshell-sandbox -n openshell` from the
agent-ops getting-started guide. MUST exist before the OpenShell chart's gateway/sandbox pods
start (ordering is load-bearing: gateway pod sticks in CreateContainerConfigError otherwise).
Guide warning: privileged is required because the supervisor sets up its own network
namespace, nftables rules, and Landlock LSM policies. Test-cluster path only.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openshell-sandbox-privileged-scc
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: sync-agent-pvc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: openshell-sandbox
    namespace: {{ .Values.namespace }}
