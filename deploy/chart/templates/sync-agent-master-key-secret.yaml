{{/*
Per-sandbox master key Secret (§9: k8s Secrets + env, NO vault v1) — the SAME
64-hex master the laptop daemon holds (~/.config/sync-agent-pvc/master.key):
the agent derives its p2p identity from it with context
"sync-agent-pvc/v1/sandbox/<id>" (crates/proto p2p.rs), and the daemon computes
the identical PeerId — no rendezvous, no DHT.

Schema path (study: docs/m4-workload-template.md): the OpenShell k8s driver's
per-sandbox driver_config accepts PVC volumes ONLY (deny_unknown_fields —
openshell-driver-kubernetes/src/driver.rs KubernetesSandboxDriverConfig), so a
Secret can NEVER be mounted into the workload pod. The value reaches the
sandbox through the create-time environment map instead: this Secret →
operator shell (`oc get secret`) → `openshell sandbox create --env-from` →
SandboxSpec.environment → workload pod env → the supervisor-spawned main
process (agent p2p env fallback, SYNC_AGENT_MASTER_KEY).

Rendered from --set at deploy time, NEVER a values.yaml entry; empty value
fails the render loudly via `required`. Gated on sandboxTemplate.enabled so
the default render/lint stays clean (flip it in the deploy values file).
*/}}
{{- if .Values.sandboxTemplate.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: sync-agent-master-key
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/part-of: sync-agent-pvc
type: Opaque
stringData:
  master-key: {{ required "sandboxTemplate.masterKey is empty — pass the 64-hex master key at deploy time (--set sandboxTemplate.masterKey=<64-hex>); it must NEVER live in values.yaml or git (§9)" .Values.sandboxTemplate.masterKey | quote }}
{{- end }}
